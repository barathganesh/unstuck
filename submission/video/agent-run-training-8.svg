<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Unstuck terminal evidence replay</title><desc id="desc">Local terminal replay of saved evidence, with recorded measurements and structured results.</desc><rect width="1280" height="720" fill="#0C0C0C"/><rect width="1280" height="38" fill="#272727"/><text x="18" y="26" font-size="17" fill="#E8E8E8" font-family="Menlo,monospace" >Terminal · unstuck</text><text x="1258" y="26" font-size="15" fill="#DBAD69" font-family="Menlo,monospace" text-anchor="end">RECORDED EVIDENCE REPLAY</text><text x="20" y="76" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >Unstuck diagnostic agent | offline training evaluation</text><text x="20" y="109" font-size="20" fill="#9C9C9C" font-family="Menlo,monospace" >Synthetic evidence • recorded results • presentation pacing</text><text x="20" y="157" font-size="22" fill="#65C751" font-family="Menlo,monospace" >(.venv)</text><text x="127" y="157" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >~/unstuck $</text><text x="284" y="157" font-size="22" fill="#E5D8A5" font-family="Menlo,monospace" >python submission/video/replay.py --training</text><text x="20" y="207" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[study]   offline synthetic | 1 seed | 20 familiar states</text><text x="20" y="237" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[train]   rows=900 | epochs=2 | optimizer_steps=52</text><text x="20" y="267" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[method]  verifier labels -&gt; LoRA adapters + choice head</text><text x="20" y="297" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[choices] base=97/160 -&gt; LoRA=129/160 | +32 correct</text><text x="20" y="327" font-size="22" fill="#8BCE76" font-family="Menlo,monospace" >[wasted]  base=20/64 -&gt; LoRA=15/64 | 25% fewer</text><text x="20" y="357" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[done]    base=44/64 -&gt; LoRA=49/64 | +5 completed</text><text x="20" y="387" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[paired]  completion_regressions=0</text><text x="20" y="417" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[target]  at least 20% fewer wasted reads + no completion regressions</text><text x="20" y="447" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >▌</text></svg>
