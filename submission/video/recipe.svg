<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Reuse the diagnostic tool selection pattern</title><desc id="desc">Reusable recipe: recipes/diagnostic-tool-selection/</desc><rect width="1280" height="720" fill="#FAF8F1"/><text x="56" y="49" font-size="18" fill="#646357" font-family="Helvetica,Arial,sans-serif" letter-spacing="4">UNSTUCK</text><text x="1224" y="49" font-size="16" fill="#A64018" font-family="Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="1.5">BUILD ON THE PATTERN</text><path d="M56 74 L1224 74" stroke="#CEC8BB"/><text x="56" y="155" font-size="48" fill="#24251F" font-family="Georgia,serif" >Bring this pattern to your agent.</text><text x="56" y="261" font-size="24" fill="#A64018" font-family="Menlo,monospace" >01</text><text x="120" y="261" font-size="32" fill="#24251F" font-family="Georgia,serif" >Match the exact context</text><text x="120" y="304" font-size="25" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Use verifier-backed receipts to remove a proven repeat.</text><text x="56" y="385" font-size="24" fill="#A64018" font-family="Menlo,monospace" >02</text><text x="120" y="385" font-size="32" fill="#24251F" font-family="Georgia,serif" >Let Decider choose</text><text x="120" y="428" font-size="25" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Preserve the remaining options and make one fresh selection.</text><text x="56" y="509" font-size="24" fill="#A64018" font-family="Menlo,monospace" >03</text><text x="120" y="509" font-size="32" fill="#24251F" font-family="Georgia,serif" >Verify the outcome</text><text x="120" y="552" font-size="25" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Record what changed and carry that evidence into the next call.</text><path d="M56 645 L1224 645" stroke="#CEC8BB"/><text x="56" y="685" font-size="19" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Reusable recipe: recipes/diagnostic-tool-selection/</text></svg>
