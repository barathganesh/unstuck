<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Unstuck terminal evidence replay</title><desc id="desc">Local terminal replay of saved evidence, with recorded measurements and structured results.</desc><rect width="1280" height="720" fill="#0C0C0C"/><rect width="1280" height="38" fill="#272727"/><text x="18" y="26" font-size="17" fill="#E8E8E8" font-family="Menlo,monospace" >Terminal · unstuck</text><text x="1258" y="26" font-size="15" fill="#DBAD69" font-family="Menlo,monospace" text-anchor="end">RECORDED EVIDENCE REPLAY</text><text x="20" y="76" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >Unstuck diagnostic agent | saved AWS run 2</text><text x="20" y="109" font-size="20" fill="#9C9C9C" font-family="Menlo,monospace" >Synthetic evidence • recorded results • presentation pacing</text><text x="20" y="157" font-size="22" fill="#65C751" font-family="Menlo,monospace" >(.venv)</text><text x="127" y="157" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >~/unstuck $</text><text x="284" y="157" font-size="22" fill="#E5D8A5" font-family="Menlo,monospace" >python submission/video/replay.py --run 2</text><text x="20" y="207" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >[request] diagnose zero-row order report | read_budget=1</text><text x="20" y="237" font-size="22" fill="#D8D8D8" font-family="Menlo,monospace" >▌</text></svg>
