<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Run 2 uses the receipt before its first Decider choice</title><desc id="desc">Recorded replay of one measured synthetic case · base Decider 2B unchanged</desc><rect width="1280" height="720" fill="#FAF8F1"/><text x="56" y="49" font-size="18" fill="#646357" font-family="Helvetica,Arial,sans-serif" letter-spacing="4">UNSTUCK</text><text x="1224" y="49" font-size="16" fill="#A64018" font-family="Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="1.5">RUN 2 · BEFORE SELECTION</text><path d="M56 74 L1224 74" stroke="#CEC8BB" stroke-width="1" fill="none"/><text x="56" y="153" font-size="56" fill="#24251F" font-family="Georgia,serif" >A fresh choice.</text><text x="56" y="216" font-size="56" fill="#24251F" font-family="Georgia,serif" >A path to completion.</text><text x="56" y="295" font-size="18" fill="#A64018" font-family="Helvetica,Arial,sans-serif" letter-spacing="1">1  CONTROLLER MATCHES THE RECEIPT</text><text x="56" y="350" font-size="31" fill="#646357" font-family="Menlo,monospace" >inspect_pipeline</text><path d="M56 339 L360 339" stroke="#A64018" stroke-width="3" fill="none"/><text x="56" y="397" font-size="25" fill="#24251F" font-family="Georgia,serif" >Exact execution withheld before selection.</text><path d="M620 282 L620 535" stroke="#CEC8BB" stroke-width="1" fill="none"/><text x="670" y="295" font-size="18" fill="#A64018" font-family="Helvetica,Arial,sans-serif" letter-spacing="1">2  DECIDER RECEIVES THE OFFER</text><text x="670" y="350" font-size="27" fill="#24251F" font-family="Georgia,serif" >2 diagnostics + request_review</text><text x="670" y="397" font-size="25" fill="#24251F" font-family="Georgia,serif" >Original order. One fresh choice.</text><text x="56" y="540" font-size="31" fill="#24251F" font-family="Georgia,serif" >The receipt removes an option; Decider still chooses.</text><text x="56" y="589" font-size="24" fill="#646357" font-family="Georgia,serif" >No read and no inference spent on the blocked execution.</text><path d="M56 645 L1224 645" stroke="#CEC8BB" stroke-width="1" fill="none"/><text x="56" y="685" font-size="20" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Recorded replay of one measured synthetic case · base Decider 2B unchanged</text></svg>
