<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Train Decider with verifier-labelled examples and replay the frozen checkpoint</title><desc id="desc">Offline training study · frozen checkpoint · AWS agent uses base Decider 2B</desc><rect width="1280" height="720" fill="#FAF8F1"/><text x="56" y="49" font-size="18" fill="#646357" font-family="Helvetica,Arial,sans-serif" letter-spacing="4">UNSTUCK</text><text x="1224" y="49" font-size="16" fill="#A64018" font-family="Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="1.5">CONTROLLED MODEL TRAINING</text><path d="M56 74 L1224 74" stroke="#CEC8BB"/><text x="56" y="151" font-size="55" fill="#24251F" font-family="Georgia,serif" >Train the next choice.</text><text x="56" y="204" font-size="29" fill="#A64018" font-family="Georgia,serif" >Verifier-labelled examples → LoRA + choice head</text><text x="56" y="294" font-size="24" fill="#A64018" font-family="Menlo,monospace" >01</text><text x="119" y="294" font-size="31" fill="#24251F" font-family="Georgia,serif" >Execute every diagnostic</text><text x="119" y="336" font-size="24" fill="#646357" font-family="Helvetica,Arial,sans-serif" >The verifier labels which read moves the decision.</text><text x="56" y="404" font-size="24" fill="#A64018" font-family="Menlo,monospace" >02</text><text x="119" y="404" font-size="31" fill="#24251F" font-family="Georgia,serif" >Train LoRA + the choice head</text><text x="119" y="446" font-size="24" fill="#646357" font-family="Helvetica,Arial,sans-serif" >900 synthetic rows · 2 epochs · 52 optimizer steps</text><text x="56" y="514" font-size="24" fill="#A64018" font-family="Menlo,monospace" >03</text><text x="119" y="514" font-size="31" fill="#24251F" font-family="Georgia,serif" >Freeze and replay through the controller</text><text x="119" y="556" font-size="24" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Receipt filters. Decider ranks. The verifier checks the result.</text><path d="M56 645 L1224 645" stroke="#CEC8BB"/><text x="56" y="685" font-size="19" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Offline training study · frozen checkpoint · AWS agent uses base Decider 2B</text></svg>
