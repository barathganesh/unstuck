<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Controlled fine-tuning success against the base checkpoint</title><desc id="desc">Base versus LoRA plus head in an offline synthetic in-distribution study. All 20 test situations occur in training. One seed. Rule reference scores 128 and 136 of 160.</desc><rect width="1280" height="720" fill="#FAF8F1"/><text x="56" y="49" font-size="18" fill="#646357" font-family="Helvetica,Arial,sans-serif" letter-spacing="4">UNSTUCK</text><text x="1224" y="49" font-size="16" fill="#A64018" font-family="Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="1.5">MEASURED TRAINING OUTCOME</text><path d="M56 74 L1224 74" stroke="#CEC8BB"/><text x="56" y="149" font-size="52" fill="#24251F" font-family="Georgia,serif" >Controlled training success.</text><text x="56" y="199" font-size="29" fill="#A64018" font-family="Georgia,serif" >25% fewer wasted first reads vs. base Decider 2B</text><text x="56" y="280" font-size="17" fill="#A64018" font-family="Helvetica,Arial,sans-serif" >CORRECT FIRST CHOICES</text><text x="56" y="352" font-size="55" fill="#24251F" font-family="Georgia,serif" >97 → 129</text><text x="56" y="395" font-size="25" fill="#646357" font-family="Georgia,serif" >of 160 decisions</text><text x="460" y="280" font-size="17" fill="#A64018" font-family="Helvetica,Arial,sans-serif" >WASTED FIRST READS</text><text x="460" y="352" font-size="55" fill="#24251F" font-family="Georgia,serif" >20 → 15</text><text x="460" y="395" font-size="25" fill="#646357" font-family="Georgia,serif" >of 64 full calls</text><text x="864" y="280" font-size="17" fill="#A64018" font-family="Helvetica,Arial,sans-serif" >VERIFIED COMPLETIONS</text><text x="864" y="352" font-size="55" fill="#24251F" font-family="Georgia,serif" >44 → 49</text><text x="864" y="395" font-size="25" fill="#646357" font-family="Georgia,serif" >of 64 full calls</text><path d="M56 435 L1224 435" stroke="#CEC8BB"/><text x="56" y="480" font-size="30" fill="#24251F" font-family="Georgia,serif" >Target: at least 20% fewer wasted first reads.</text><text x="56" y="525" font-size="27" fill="#24251F" font-family="Georgia,serif" >Achieved: 25% reduction and 5 additional completed workflows.</text><text x="56" y="576" font-size="23" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Zero paired completion regressions. CPU replay supports the direction.</text><text x="56" y="615" font-size="21" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Rule references on the same rows: 128 and 136 correct choices.</text><path d="M56 645 L1224 645" stroke="#CEC8BB"/><text x="56" y="685" font-size="19" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Offline synthetic study · 20 familiar states · one seed · 160 decisions · 64 calls</text></svg>
