<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Receipt filtering happens before selection; the remaining tools stay available to Decider.</title><desc id="desc">Verbatim excerpts from recipes/diagnostic-tool-selection/selector.py, original line numbers; highlighted lines explain the decision boundary.</desc><rect width="1280" height="720" fill="#FFFFFF"/><rect width="1280" height="43" fill="#ECECEC"/><rect y="43" width="1280" height="45" fill="#F7F7F7"/><text x="20" y="29" font-size="18" fill="#444444" font-family="Menlo,monospace" >unstuck · recipes/diagnostic-tool-selection/selector.py</text><text x="30" y="73" font-size="21" fill="#333333" font-family="Menlo,monospace" >selector.py</text><rect x="70" y="108" width="1185" height="32" fill="#FFF2A8"/><text x="53" y="132" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">857</text><text x="82" y="132" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">    receipts = store.matching(context)</text><text x="53" y="165" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">858</text><text x="82" y="165" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">    classes = tuple(receipt.match(context) <tspan fill="#7B318D">for</tspan> receipt <tspan fill="#7B318D">in</tspan> receipts)</text><rect x="70" y="174" width="1185" height="32" fill="#FFF2A8"/><text x="53" y="198" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">859</text><text x="82" y="198" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">    precluded = preclusions(context, catalog, available, store)</text><text x="53" y="231" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">860</text><text x="82" y="231" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">    remaining = frozenset(</text><text x="53" y="264" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">861</text><text x="82" y="264" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">        tool_id</text><text x="53" y="297" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">862</text><text x="82" y="297" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">        <tspan fill="#7B318D">for</tspan> tool_id <tspan fill="#7B318D">in</tspan> available</text><rect x="70" y="306" width="1185" height="32" fill="#FFF2A8"/><text x="53" y="330" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">863</text><text x="82" y="330" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">        <tspan fill="#7B318D">if</tspan> tool_id <tspan fill="#7B318D">not</tspan> <tspan fill="#7B318D">in</tspan> {item.tool_id <tspan fill="#7B318D">for</tspan> item <tspan fill="#7B318D">in</tspan> precluded}</text><text x="53" y="363" font-size="19" fill="#999999" font-family="Menlo,monospace" text-anchor="end">864</text><text x="82" y="363" font-size="21" fill="#27364B" font-family="Menlo,monospace" xml:space="preserve">    )</text><rect y="646" width="1280" height="74" fill="#EEF4FA"/><text x="26" y="680" font-size="22" fill="#174B73" font-family="Helvetica,Arial,sans-serif" >Receipt filtering happens before selection; the remaining tools stay available to Decider.</text><text x="26" y="706" font-size="15" fill="#53738B" font-family="Helvetica,Arial,sans-serif" >Actual repository code • excerpts preserve source line numbers</text></svg>
