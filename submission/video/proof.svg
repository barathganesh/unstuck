<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Controlled AWS result: one fewer inference and 51.4 percent lower observed Run 2 client time</title><desc id="desc">Recorded synthetic case · n = 1 · each proof once · client elapsed time</desc><rect width="1280" height="720" fill="#FAF8F1"/><text x="56" y="49" font-size="18" fill="#646357" font-family="Helvetica,Arial,sans-serif" letter-spacing="4">UNSTUCK</text><text x="1224" y="49" font-size="16" fill="#A64018" font-family="Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="1.5">CONTROLLED AWS SUCCESS</text><path d="M56 74 L1224 74" stroke="#CEC8BB"/><text x="56" y="157" font-size="46" fill="#24251F" font-family="Georgia,serif" >The same goal. One fewer inference.</text><text x="56" y="286" font-size="106" fill="#A64018" font-family="Georgia,serif" >51.4%</text><text x="56" y="335" font-size="28" fill="#24251F" font-family="Georgia,serif" >lower observed Run 2 client time</text><text x="760" y="250" font-size="54" fill="#24251F" font-family="Georgia,serif" >54.8 → 26.6 s</text><text x="760" y="302" font-size="23" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Earlier flow → receipt before selection</text><path d="M56 385 L1224 385" stroke="#CEC8BB"/><text x="56" y="447" font-size="53" fill="#24251F" font-family="Georgia,serif" >2 → 1</text><text x="280" y="444" font-size="29" fill="#24251F" font-family="Georgia,serif" >Decider inferences in Run 2</text><text x="56" y="517" font-size="30" fill="#24251F" font-family="Georgia,serif" >Receipt check first. Fresh tool choice. Verified completion.</text><text x="56" y="580" font-size="24" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Comparison: earlier and current Unstuck Run 2 on the same endpoint.</text><path d="M56 645 L1224 645" stroke="#CEC8BB"/><text x="56" y="685" font-size="19" fill="#646357" font-family="Helvetica,Arial,sans-serif" >Recorded synthetic case · n = 1 · each proof once · client elapsed time</text></svg>
